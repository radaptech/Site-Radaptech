name: Probe FTP

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq lftp >/dev/null
      - run: lftp -u "$U,$P" "$S" -e "set ssl:verify-certificate no; pwd; ls -la; ls -la public_html; ls -la domains; bye"
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
